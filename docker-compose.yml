services:
    # PHP + Laravel (Aplicación principal AgroSys)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: agrosys-app
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        command: php artisan serve --host=0.0.0.0 --port=8000
        depends_on:
            mysql:
                condition: service_healthy
            postgres:
                condition: service_healthy
        networks:
            - agrosys-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - PHP_VERSION=8.4
            - TZ=America/Lima

    # MySQL 8.4 (Base de Datos Primaria)
    mysql:
        image: mysql:8.4
        container_name: agrosys-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
            MYSQL_DATABASE: ${DB_DATABASE:-agrosys}
            MYSQL_USER: ${DB_USERNAME:-agrosys}
            MYSQL_PASSWORD: ${DB_PASSWORD:-agrosys123}
        ports:
            - "${DB_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123}"]
            timeout: 20s
            retries: 10
            interval: 10s
        networks:
            - agrosys-network

    # PostgreSQL 17 (Base de Datos Secundaria / Replicación Dual)
    postgres:
        image: postgres:17-alpine
        container_name: agrosys-postgres
        restart: always
        environment:
            POSTGRES_DB: ${DB_PGSQL_DATABASE:-agrosys}
            POSTGRES_USER: ${DB_PGSQL_USERNAME:-agrosys}
            POSTGRES_PASSWORD: ${DB_PGSQL_PASSWORD:-agrosys123}
        ports:
            - "${DB_PGSQL_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_PGSQL_USERNAME:-agrosys} -d ${DB_PGSQL_DATABASE:-agrosys}"]
            timeout: 5s
            retries: 5
            interval: 5s
        networks:
            - agrosys-network

    # Node.js + Vite
    node:
        image: node:22-alpine
        container_name: agrosys-node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run build -- --host 0.0.0.0"
        networks:
            - agrosys-network
        environment:
            - NODE_ENV=development

    # Composer
    composer:
        image: composer:2
        container_name: agrosys-composer
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        command: composer install
        networks:
            - agrosys-network

volumes:
    mysql_data:
    postgres_data:
    node_modules:

networks:
    agrosys-network:
        driver: bridge
